title: xterm_view
description: ascii art an blog
url: https://www.jonf.blog
markdown: kramdown

collections:
  pieces:
    output: true
    permalink: /pieces/:name/

defaults:
  # the belt: nothing renders without a layout, ever. broad
  # scope first, narrower scopes override further down.
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      type: pieces
    values:
      layout: piece
      parent: /pieces.html
      lx: caps-l
  - scope:
      type: posts
    values:
      layout: post
      parent: /posts.html

exclude:
  - notes/
  - plan-xterm-view.md

# visible column limit for art. warns per line over; set
# xterm_max_strict: true to make the build refuse instead.
# delete the line to switch the limit off entirely.
xterm_max_width: 80

# the guestbook wall: replies to this bsky post are rendered
# by _plugins/guestbook.rb at build. swap the url to move the
# wall to a real guestbook post.
guestbook_post: https://bsky.app/profile/kriswilson.bsky.social/post/3mz4l63dru226
