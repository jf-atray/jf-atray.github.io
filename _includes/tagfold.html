{% assign tagged = site.pieces | where_exp: "p", "p.tags contains include.tag" | sort: "title" %}
<details class="tagfold"{% if include.open %} open{% endif %}>
<summary>{{ include.title | default: include.tag }}</summary>
<ul>
{% for p in tagged %}<li><a href="{{ p.url | relative_url }}">{{ p.title }}</a></li>{% endfor %}
</ul>
</details>
